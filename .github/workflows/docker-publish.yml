name: HTML Docker CI/CD Pipeline

on:
  push:
    branches:
      - main

# 🛡️ هذا هو السطر السحري اللي بيحل مشكلة الـ 403
permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t my-html-app .

      - name: Run Docker Container
        run: docker run -d -p 8080:80 --name test-app my-html-app

      - name: Wait for container
        run: sleep 5

      - name: Check container status
        run: docker ps -a

      - name: Test Application
        run: curl -f http://localhost:8080


      # 📋 خطوة جديدة: شوف Logs الـ Container
      - name: Show container logs
        run: docker logs test-app

    #  - name: Deploy to GitHub Pages
        # uses: peaceiris/actions-gh-pages@v4  # (حدثنا الإصدار لـ v4 عشان نتجنب تحذيرات Node)
        # with:
        #   github_token: ${{ secrets.GITHUB_TOKEN }}
        #   publish_dir: .
        #   publish_branch: gh-pages

      - name: Cleanup
        if: always()
        run: |
          docker stop test-app
          docker rm test-app
